<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dame de Pique</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f5132; --card-bg: #ffffff; --text: #1a1a1a;
      --primary: #2563eb; --primary-hover: #1d4ed8; --success: #059669;
      --secondary: #6b7280; --danger: #dc2626;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; padding: 12px; display: flex; flex-direction: column; align-items: center;
      touch-action: manipulation;
    }
    .screen { width: 100%; max-width: none; display: none; flex-direction: column; gap: 12px; align-items: center; }
    .screen.active { display: flex; }
    .card { width: 100%; max-width: none; min-width: 280px; background: var(--card-bg); border-radius: 16px; padding: 30px 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
    .hidden { display: none !important; }
    h1 { font-size: 28px; text-align: center; margin-bottom: 6px; color: var(--primary); }
    h2 { font-size: 20px; text-align: center; margin-bottom: 8px; }
    .subtitle { text-align: center; color: var(--secondary); font-size: 14px; margin-bottom: 16px; }
    h3 { font-size: 16px; text-align: center; margin-bottom: 8px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    input[type="text"] { width: 100%; padding: 12px 14px; font-size: 16px; border: 2px solid #e5e7eb; border-radius: 8px; outline: none; }
    input[type="text"]:focus { border-color: var(--primary); }
    .btn { width: 100%; padding: 12px 16px; font-size: 16px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; text-align: center; margin-top: 8px; touch-action: manipulation; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-secondary { background: #f3f4f6; color: var(--text); border: 1px solid #e5e7eb; }
    .btn-secondary:hover:not(:disabled) { background: #e5e7eb; }
    .btn-danger { background: var(--danger); color: #fff; }
    .rooms-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
    .room-btn { width: 100%; padding: 18px 12px; font-size: 15px; font-weight: 700; border: 2px solid #e5e7eb; border-radius: 12px; background: #fff; color: var(--text); cursor: pointer; touch-action: manipulation; }
    .room-btn:hover { border-color: var(--primary); background: #eff6ff; }
    .room-btn.full { opacity: 0.6; cursor: not-allowed; }
    .room-btn.started { background: #fee2e2; border-color: var(--danger); color: var(--danger); }
    .room-status { text-align: center; font-size: 13px; color: var(--secondary); min-height: 20px; }
    .hint { font-size: 13px; color: var(--secondary); text-align: center; margin-top: 8px; }
    .waiting-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .badge { font-size: 14px; font-weight: 700; background: #e5e7eb; padding: 4px 10px; border-radius: 20px; color: var(--text); }
    .players-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .player-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; }
    .player-item.me { background: #eff6ff; border-color: var(--primary); }
    .player-item.host::after { content: ' (hôte)'; font-size: 12px; color: var(--primary); font-weight: 700; margin-left: 6px; }
    .player-status { font-size: 12px; font-weight: 700; }
    .player-status.ready { color: var(--success); } .player-status.notready { color: var(--secondary); }
    .waiting-actions { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    #waiting-msg { font-size: 13px; text-align: center; color: var(--secondary); min-height: 18px; }
    .game-container { width: 100%; max-width: none; }
    .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 0 4px; }
    .turn-indicator { font-size: 15px; font-weight: 700; color: var(--primary); }
    .round-badge { font-size: 13px; font-weight: 700; background: #fff; border: 1px solid #e5e7eb; padding: 4px 10px; border-radius: 20px; }
    .scores { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 12px; padding: 0 4px; }
    .score-box { flex: 1; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px; text-align: center; }
    .score-name { font-size: 12px; color: var(--secondary); margin-bottom: 4px; }
    .score-value { font-size: 18px; font-weight: 800; color: var(--text); }
    .trick-area { height: 110px; width: 280px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; border: 2px dashed #e5e7eb; border-radius: 12px; background: #fafafa; }
    .trick-cards { display: flex; gap: 8px; align-items: center; justify-content: center; }
    .trick-placeholder { font-size: 13px; color: var(--secondary); }
    .players-hands { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 0 4px; }
    .opponent-hand { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .opponent-name { font-size: 12px; font-weight: 700; color: var(--text); }
    .opponent-count { font-size: 12px; color: var(--secondary); }
    .cards-stack { width: 48px; height: 68px; background: linear-gradient(135deg, #1e3a8a 25%, #1e40af 25%, #1e40af 50%, #2563eb 50%, #2563eb 75%, #1e3a8a 75%); background-size: 16px 16px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: 800; border: 2px solid #1e3a8a; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
    .my-hand { margin-bottom: 16px; }
    .hand-cards { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 0 4px; }
    .game-card { width: 62px; height: 90px; background: linear-gradient(145deg, #ffffff, #f3f4f6); border: 2px solid #374151; border-radius: 10px; display: flex; flex-direction: column; padding: 6px 4px; font-size: 14px; font-weight: 800; cursor: pointer; user-select: none; touch-action: manipulation; position: relative; box-shadow: 0 6px 12px rgba(0,0,0,0.25); overflow: hidden; }
    .game-card.red { color: #dc2626; } .game-card.black { color: #111827; }
    .trick-card.red { color: #dc2626; } .trick-card.black { color: #111827; }
    .game-card.rank-top { font-size: 12px; align-self: flex-start; }
    .game-card.suit-big { align-self: center; margin-top: auto; font-size: 28px; opacity: 0.85; }
    .game-card.selected { border-color: var(--primary); background: #dbeafe; transform: translateY(-10px) scale(1.02); z-index: 10; box-shadow: 0 8px 16px rgba(37,99,235,0.35); }
    .game-card.disabled { opacity: 0.5; cursor: not-allowed; }
    .trick-card { width: 62px; height: 90px; background: linear-gradient(145deg, #ffffff, #f3f4f6); border: 2px solid #374151; border-radius: 10px; display: flex; flex-direction: column; padding: 6px 4px; font-size: 14px; font-weight: 800; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
    .game-msg { min-height: 24px; font-size: 14px; font-weight: 600; text-align: center; margin-bottom: 12px; color: var(--primary); }
    .game-controls { display: flex; flex-direction: column; gap: 8px; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .modal { position: fixed; inset: 0; z-index: 1010; display: flex; align-items: center; justify-content: center; }
    .modal.hidden, .overlay.hidden { display: none; }
    .modal-content { background: #fff; border-radius: 16px; padding: 28px 24px; max-width: 90%; width: 320px; text-align: center; box-shadow: 0 12px 32px rgba(0,0,0,0.3); }
    .modal-content h3 { margin-bottom: 12px; }
    .modal-content p { margin-bottom: 20px; font-size: 15px; color: #374151; }
    .scores-table { width: 100%; border-collapse: collapse; margin: 0 auto; }
    .scores-table th, .scores-table td { border: 1px solid #e5e7eb; padding: 6px 10px; text-align: center; }
    .scores-table th { background: #f9fafb; font-weight: 800; }
    .turn-timer { font-size: 14px; font-weight: 800; color: var(--danger); background: #fff; border: 1px solid #e5e7eb; border-radius: 20px; padding: 4px 10px; }
    .game-card.playable { border-color: var(--success); background: #d1fae5; transform: translateY(-8px) scale(1.02); z-index: 10; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.3); }
    .game-card.disabled { opacity: 0.5; cursor: not-allowed; }

    /* Table layout */
    .table-layout { display: grid; grid-template-rows: 80px 1fr 120px; grid-template-columns: 120px 1fr 120px; gap: 4px; height: calc(100vh - 260px); }
    .seat { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .seat.top-seat { grid-row: 1; grid-column: 2; }
    .seat.left-seat { grid-row: 2; grid-column: 1; }
    .seat.right-seat { grid-row: 2; grid-column: 3; }
    .seat.bottom-seat { grid-row: 3; grid-column: 2; }
    .row-center { grid-row: 2; grid-column: 2; display: flex; align-items: center; justify-content: center; }
    .trick-area-center { display: flex; align-items: center; justify-content: center; }
    .opponent-hand.vertical { display: flex; flex-direction: column; align-items: center; }

  </style>
</head>
<body>

<div id="app">

  <div class="screen active" id="screen-nickname">
    <div class="card">
      <h1>Dame de Pique</h1>
      <p class="subtitle">Jeu de cartes &agrave; 4 joueurs</p>
      <div class="form-group">
        <label for="nickname">Votre surnom</label>
        <input type="text" id="nickname" placeholder="Entrez votre surnom" maxlength="20">
      </div>
      <button id="btn-continue" class="btn btn-primary" disabled>Continuer</button>
      <div id="js-error" style="display:none;color:#dc2626;font-size:13px;margin-top:8px;text-align:center;"></div>
      <p class="hint">Le surnom est obligatoire pour entrer dans une salle.</p>
    </div>
  </div>

  <div class="screen hidden" id="screen-rooms">
    <div class="card">
      <h1>Salles d'attente</h1>
      <p class="subtitle">Choisissez une salle (20 min max)</p>
      <div class="rooms-grid" id="rooms-grid"></div>
      <div class="room-status" id="room-status"></div>
      <button id="btn-back-rooms" class="btn btn-secondary">Retour</button>
    </div>
  </div>

  <div class="screen hidden" id="screen-waiting">
    <div class="card">
      <div class="waiting-header">
        <h2 id="waiting-room-title">Salle <span id="waiting-room-id"></span></h2>
        <span id="waiting-countdown" class="badge">--:--</span>
      </div>
      <div class="players-list" id="players-list"></div>
      <div class="waiting-actions">
        <button id="btn-ready" class="btn btn-primary">Pr&ecirc;t</button>
        <button id="btn-start" class="btn btn-success hidden">D&eacute;marrer la partie</button>
        <button id="btn-leave-waiting" class="btn btn-secondary">Quitter la salle</button>
      </div>
      <div id="waiting-msg"></div>
    </div>
  </div>

  <div class="screen hidden" id="screen-game">
      <div class="game-container">
        <div class="game-header">
          <div class="turn-indicator" id="turn-indicator">Tour de <span id="turn-name"></span></div>
          <div class="round-badge" id="round-badge">Round 1</div>
          <div id="turn-timer" class="turn-timer">--:--</div>
        </div>
        <div class="scores" id="scores"></div>
        <div class="table-layout">
          <div class="seat top-seat" id="seat-top">
            <div class="opponent-hand">
              <div class="opponent-name" id="name-top"></div>
              <div class="cards-stack" id="stack-top">0</div>
              <div class="opponent-count" id="count-top">0 cartes</div>
            </div>
          </div>
          <div class="row-center">
            <div class="seat left-seat" id="seat-left">
              <div class="opponent-hand vertical">
                <div class="opponent-name" id="name-left"></div>
                <div class="cards-stack" id="stack-left">0</div>
                <div class="opponent-count" id="count-left">0 cartes</div>
              </div>
            </div>
            <div class="trick-area-center">
              <div class="trick-area" id="trick-area">
                <div class="trick-placeholder">Plis en cours</div>
                <div class="trick-cards" id="trick-cards"></div>
              </div>
            </div>
            <div class="seat right-seat" id="seat-right">
              <div class="opponent-hand vertical">
                <div class="opponent-name" id="name-right"></div>
                <div class="cards-stack" id="stack-right">0</div>
                <div class="opponent-count" id="count-right">0 cartes</div>
              </div>
            </div>
          </div>
          <div class="seat bottom-seat" id="seat-bottom">
            <div class="my-hand">
              <h3>Votre main</h3>
              <div class="hand-cards" id="hand-cards"></div>
            </div>
          </div>
        </div>
        <div class="game-msg" id="game-msg"></div>
        <div class="game-controls" id="game-controls"></div>
      </div>
  </div>

  <div id="overlay" class="overlay hidden"></div>
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="modal-title"></h3>
      <p id="modal-body"></p>
      <button id="modal-ok" class="btn btn-primary">OK</button>
    </div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/client.js?v=13"></script>
</body>
</html>
